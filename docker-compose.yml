services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: 72246
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: auth_db, POSTGRES_USER: social_user, POSTGRES_PASSWORD: local_dev_change_me }
    volumes: [auth_data:/var/lib/postgresql/data, ./services/auth-service/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: users_db, POSTGRES_USER: social_user, POSTGRES_PASSWORD: local_dev_change_me }
    volumes: [users_data:/var/lib/postgresql/data, ./services/user-service/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  posts-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: posts_db, POSTGRES_USER: social_user, POSTGRES_PASSWORD: local_dev_change_me }
    volumes: [posts_data:/var/lib/postgresql/data, ./services/post-service/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d posts_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  messages-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: messages_db, POSTGRES_USER: social_user, POSTGRES_PASSWORD: local_dev_change_me }
    volumes: [messages_data:/var/lib/postgresql/data, ./services/messaging-service/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d messages_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      PORT: 5001
      DB_HOST: auth-db
      DB_NAME: auth_db
      DB_USER: social_user
      DB_PASSWORD: local_dev_change_me
      JWT_SECRET: local_dev_jwt_secret_change_before_deploy
      RABBITMQ_URL: amqp://social_user:local_dev_change_me@rabbitmq:5672
    ports: ["5001:5001"]
    depends_on:
      auth-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  user-service:
    build: ./services/user-service
    environment:
      PORT: 5002
      DB_HOST: users-db
      DB_NAME: users_db
      DB_USER: social_user
      DB_PASSWORD: local_dev_change_me
      JWT_SECRET: local_dev_jwt_secret_change_before_deploy
      RABBITMQ_URL: amqp://social_user:local_dev_change_me@rabbitmq:5672
    ports: ["5002:5002"]
    depends_on:
      users-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  post-service:
    build: ./services/post-service
    environment:
      PORT: 5003
      DB_HOST: posts-db
      DB_NAME: posts_db
      DB_USER: social_user
      DB_PASSWORD: local_dev_change_me
      JWT_SECRET: local_dev_jwt_secret_change_before_deploy
      RABBITMQ_URL: amqp://social_user:local_dev_change_me@rabbitmq:5672
    ports: ["5003:5003"]
    depends_on:
      posts-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  messaging-service:
    build: ./services/messaging-service
    environment:
      PORT: 5004
      DB_HOST: messages-db
      DB_NAME: messages_db
      DB_USER: social_user
      DB_PASSWORD: local_dev_change_me
      JWT_SECRET: local_dev_jwt_secret_change_before_deploy
      RABBITMQ_URL: amqp://social_user:local_dev_change_me@rabbitmq:5672
    ports: ["5004:5004"]
    depends_on:
      messages-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  auth_data:
  users_data:
  posts_data:
  messages_data:
